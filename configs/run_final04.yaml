# final_04 — scored autonomous run.
#
# Starts from configs/phase2_fm.json, which reproduces the official baseline
# validation primary exactly (0.6014687563529677), satisfying Task Requirement 1
# before the agent improves on it. Note that configs/pipeline_seed.json is no
# longer baseline-equivalent: once model.fm_baseline was fixed to actually consume
# its feature inputs, that graph's duration/temporal bundles began degrading it
# to 0.5916. Convergence uses the organizers' published rule verbatim
# (epsilon = 0.002, N = 3), with their 50-iteration and 6-hour ceilings as the
# backstops. The operator registry is the agent's action space; which operators
# to compose, with what parameters, is the agent's decision.
seed_graph: configs/phase2_fm.json
loop:
  max_iterations: 50
  max_wall_clock_s: 21600
  iteration_timeout_s: 1800
  memory_limit_mb: 8192
  # Official convergence rule from the problem statement (section 2.4).
  convergence_window: 3
  convergence_delta: 0.002
  significance_threshold: 0.0016
  confirm_small_deltas: true
  # MLE-STAR style nested loop: explore several variants of the ablated
  # component before moving on, counted as one outer refinement.
  inner_refinement_attempts: 4
  validation_reproposal_attempts: 3
  repair_attempts: 3
evaluation:
  mode: production
  data_dir: data/kuairand-pure/data
  starter_kit_dir: data/starter-kit
  baseline_primary: 0.6014687563529677
llm:
  mode: live
  model: gpt-5.6-terra
  repair_model: gpt-5.6-luna
  reasoning_effort: low
  repair_reasoning_effort: low
  max_retries: 3
