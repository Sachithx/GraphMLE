seed_graph: configs/pipeline_seed.json
loop:
  max_iterations: 50
  max_wall_clock_s: 21600
  iteration_timeout_s: 900
  memory_limit_mb: 4096
  convergence_window: 3
  convergence_delta: 0.002
  significance_threshold: 0.0016
  confirm_small_deltas: true
  repair_attempts: 3
evaluation:
  mode: production
  data_dir: data/kuairand-pure/data
  starter_kit_dir: data/starter-kit
  baseline_primary: 0.6016
llm:
  mode: live
  model: gpt-5.4
  max_retries: 3
dry_run_hypotheses:
  - id: dry_001_listwise
    target_node: model
    rationale: Move from pointwise training to within-user listwise ranking.
    method_source: listwise ranking, LambdaRank
    expected_delta: 0.012
    expected_cost_minutes: 8
    patch:
      op: replace_params
      node: model
      params: {seed: 0, objective: lambdarank, num_leaves: 63, lr: 0.05, n_estimators: 400, group_by: user_id}
  - id: dry_002_multitask
    target_node: model
    rationale: Use same-row outcomes only as auxiliary targets.
    method_source: multi-task shared representation
    expected_delta: 0.009
    expected_cost_minutes: 12
    patch:
      op: replace_params
      node: model
      params: {seed: 0, auxiliary_targets: [is_click, is_like, is_follow]}
  - id: dry_003_duration
    target_node: raw
    rationale: Add a static duration view without outcome leakage.
    method_source: duration-bias framing
    expected_delta: 0.004
    expected_cost_minutes: 4
    patch:
      op: add_node
      node:
        id: duration
        type: features.video_duration
        params: {buckets: 10}
        inputs: [load]
  - id: dry_004_tuning
    target_node: model
    rationale: Refine capacity after larger objective changes.
    method_source: bounded hyperparameter tuning
    expected_delta: 0.001
    expected_cost_minutes: 3
    patch:
      op: replace_params
      node: model
      params: {seed: 7}
  - id: dry_005_tuning
    target_node: model
    rationale: Final small learning-rate test.
    method_source: bounded hyperparameter tuning
    expected_delta: 0.0005
    expected_cost_minutes: 3
    patch:
      op: replace_params
      node: model
      params: {seed: 11}

