# final_07 - restart with seed bagging made expressible.
#
# Offline measurement showed the largest available gain on this benchmark is seed
# bagging the incumbent (+0.0015 over a single seed), but the action space could
# not express it: a bag needs three coordinated edits, and each intermediate graph
# leaves an unreachable node that validation correctly rejects. The atomic
# bag_node patch closes that gap. Guidance was also updated with the measured
# result that stacking feature bundles onto an FM does additive damage.
#
# Seeds from final_06's converged graph. Organiser convergence rule and ceilings
# unchanged. No human edits the graph during the run.
seed_graph: runs/final_06/best/graph.json
loop:
  max_iterations: 50
  max_wall_clock_s: 21600
  iteration_timeout_s: 1800
  memory_limit_mb: 8192
  convergence_window: 3
  convergence_delta: 0.002
  significance_threshold: 0.0016
  confirm_small_deltas: true
  inner_refinement_attempts: 4
  validation_reproposal_attempts: 3
  repair_attempts: 3
evaluation:
  mode: production
  data_dir: data/kuairand-pure/data
  starter_kit_dir: data/starter-kit
  baseline_primary: 0.6014687563529677
llm:
  mode: live
  model: gpt-5.6-terra
  repair_model: gpt-5.6-luna
  reasoning_effort: low
  repair_reasoning_effort: low
  max_retries: 3
